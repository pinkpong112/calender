<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>교대근무 1년 자동 달력</title>
  <style>
    :root{
      --bg:#ffffff; --surface:#f9f8f7; --surface2:#f0efed; --text:#2c2c2b; --muted:#7d7a75; --border:#e6e5e3;
      --blue:#2783de; --blueSoft:#e5f2fc; --green:#46a171; --greenSoft:#e8f1ec; --orange:#d5803b; --orangeSoft:#fbebde;
      --red:#e56458; --redSoft:#fce9e7; --purple:#7e5bef; --purpleSoft:#eeeafd; --night:#51606f; --nightSoft:#e9edf2;
      --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;font-size:15px;line-height:1.45}
    .app{max-width:1180px;margin:0 auto;padding:22px 24px 32px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:18px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-bottom:4px}.title{font-size:30px;line-height:1.08;font-weight:800;letter-spacing:-.03em;margin:0}.subtitle{margin:8px 0 0;color:var(--muted);max-width:660px}.summary{display:grid;grid-template-columns:repeat(4,minmax(82px,1fr));gap:8px;min-width:360px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:16px}.controls{display:grid;grid-template-columns:1.05fr .95fr 1.3fr auto;gap:12px;align-items:end}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 6px}.field input,.field select{width:100%;min-height:42px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);padding:9px 10px;font:inherit}.patternHelp{font-size:12px;color:var(--muted);margin-top:6px}.btns{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:42px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);padding:9px 12px;font-weight:700;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:focus,.shift:focus,.day:focus{outline:3px solid rgba(39,131,222,.22);outline-offset:2px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 9px;font-size:13px}.dot{width:9px;height:9px;border-radius:50%}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 2px}.toolbar h2{font-size:18px;margin:0;letter-spacing:-.02em}.legend{display:flex;gap:8px;flex-wrap:wrap}.legend .chip{padding:5px 8px;background:var(--surface)}.calendar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.month{border:1px solid var(--border);border-radius:14px;background:#fff;overflow:hidden}.monthHead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface)}.monthHead strong{font-size:15px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:7px 0}.day{position:relative;min-height:44px;border:0;border-top:1px solid rgba(230,229,227,.6);border-right:1px solid rgba(230,229,227,.6);background:#fff;text-align:left;padding:5px 5px 4px;cursor:pointer;color:var(--text)}.day:nth-child(7n){border-right:0}.day.blank{cursor:default;background:#fbfbfa}.num{font-size:11px;color:var(--muted);display:block}.tag{display:inline-block;margin-top:3px;padding:2px 5px;border-radius:6px;font-size:11px;font-weight:800;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.today{box-shadow:inset 0 0 0 2px var(--blue)}.override:after{content:"•";position:absolute;right:5px;top:2px;color:var(--orange);font-size:18px;line-height:1}.selected{box-shadow:inset 0 0 0 2px var(--orange)}
    .D .tag{background:var(--blueSoft);color:#1769b4}.E .tag{background:var(--orangeSoft);color:#9a5a20}.N .tag{background:var(--nightSoft);color:#374554}.O .tag{background:var(--greenSoft);color:#2d7a52}.V .tag{background:var(--purpleSoft);color:#6445d8}.X .tag{background:var(--redSoft);color:#b93d34}.memo{margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.hint{color:var(--muted);font-size:13px}.footer{margin-top:12px;color:var(--muted);font-size:12px}.saveState{display:inline-block;margin-left:6px}.saveState.warn{color:var(--orange);font-weight:700}.toast{position:fixed;right:18px;bottom:18px;background:#2c2c2b;color:#fff;padding:10px 12px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:980px){.hero{align-items:stretch;flex-direction:column}.summary{min-width:0}.controls{grid-template-columns:1fr 1fr}.calendar{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:620px){.app{padding:18px 16px}.title{font-size:25px}.summary{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.calendar{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.memo{grid-template-columns:1fr}.memo .btns{width:100%}.memo .btn{flex:1 1 calc(25% - 8px);padding:9px 8px}.hint{line-height:1.5}.day{min-height:48px}}
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div><div class="eyebrow">SHIFT CALENDAR</div><h1 class="title">교대근무 1년 자동 달력</h1><p class="subtitle">기준일과 근무 패턴만 입력하면 12개월 근무표가 자동 생성됩니다. 특정 날짜는 클릭해서 예외 근무로 바꿀 수 있어요.</p></div>
      <div class="summary" id="summary"></div>
    </section>
    <section class="panel" aria-label="근무 패턴 설정">
      <div class="controls">
        <div class="field"><label for="yearStart">달력 시작일</label><input id="yearStart" type="date" /></div>
        <div class="field"><label for="baseDate">패턴 기준일</label><input id="baseDate" type="date" /></div>
        <div class="field"><label for="pattern">반복 패턴</label><input id="pattern" value="주,주,야,야,휴,휴" placeholder="예: 주,주,야,야,휴,휴" /><div class="patternHelp">가능: 주/주간, 석/석간, 야/야간, 휴/비번/휴무, 연/연차, 교/교육</div></div>
        <div class="btns"><button class="btn primary" id="apply">저장·업데이트</button><button class="btn" id="backup">백업 코드</button><button class="btn" id="restore">복구</button><button class="btn" id="reset">초기화</button></div>
      </div>
      <div class="chips" id="patternPreview"></div>
      <div class="memo"><div class="hint" id="selectedHint">날짜를 클릭하면 그날만 근무를 수정합니다.</div><div class="btns" id="quickButtons"></div></div>
    </section>
    <div class="toolbar"><h2 id="rangeTitle">근무 달력</h2><div class="legend" id="legend"></div></div>
    <section class="calendar" id="calendar" aria-label="1년 근무 달력"></section>
    <p class="footer">※ 설정은 입력할 때마다 자동 저장됩니다. 브라우저 저장소가 제한된 환경에서는 백업 코드를 보관해 주세요.<span class="saveState" id="saveState" aria-live="polite"></span></p>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const shifts = {
    D:{label:'주간', aliases:['주','주간','day','d'], cls:'D', color:'#2783de'},
    E:{label:'석간', aliases:['석','석간','오후','evening','e'], cls:'E', color:'#d5803b'},
    N:{label:'야간', aliases:['야','야간','night','n'], cls:'N', color:'#51606f'},
    O:{label:'휴무', aliases:['휴','휴무','비번','off','o'], cls:'O', color:'#46a171'},
    V:{label:'연차', aliases:['연','연차','휴가','vacation','v'], cls:'V', color:'#7e5bef'},
    X:{label:'교육', aliases:['교','교육','훈련','x'], cls:'X', color:'#e56458'}
  };
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
  const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
  const diffDays = (a,b) => Math.round((parseISO(a)-parseISO(b))/86400000);
  const todayISO = toISO(new Date());
  const defaultStart = `${new Date().getFullYear()}-01-01`;
  const STORAGE_KEY='shiftCalendarV3';
  const LEGACY_KEYS=['shiftCalendarV2'];
  const defaults=()=>({yearStart:defaultStart,baseDate:todayISO,pattern:'주,주,야,야,휴,휴',overrides:{},updatedAt:0});
  const encodeState=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  const decodeState=t=>JSON.parse(decodeURIComponent(escape(atob(t))));
  const validDate=s=>typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !Number.isNaN(parseISO(s).getTime());
  function validState(v){ return v && validDate(v.yearStart) && validDate(v.baseDate) && typeof v.pattern==='string' && v.pattern.trim() && v.overrides && typeof v.overrides==='object'; }
  function readSaved(){
    const candidates=[];
    const add=v=>{try{const x=typeof v==='string'?JSON.parse(v):v;if(validState(x))candidates.push(x)}catch(e){}};
    const hash=new URLSearchParams(location.hash.slice(1)).get('state');
    if(hash){try{add(decodeState(hash))}catch(e){}}
    for(const store of [localStorage,sessionStorage]){
      try{add(store.getItem(STORAGE_KEY)); for(const key of LEGACY_KEYS)add(store.getItem(key))}catch(e){}
    }
    try{if(window.name&&window.name.startsWith('shiftCalendar:'))add(decodeState(window.name.slice(14)))}catch(e){}
    return candidates.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0] || defaults();
  }
  let state=readSaved();
  let selectedDate = null;
  let saveTimer=null;
  let storageAvailable=false;
  function normalizeToken(raw){
    const t = raw.trim().toLowerCase();
    for(const [key,s] of Object.entries(shifts)) if(s.aliases.includes(t) || s.label.toLowerCase()===t) return key;
    return 'O';
  }
  function patternKeys(){ return state.pattern.split(/[,\s>→-]+/).filter(Boolean).map(normalizeToken).filter(Boolean); }
  function shiftForDate(iso){
    if(state.overrides[iso]) return state.overrides[iso];
    const p = patternKeys(); if(!p.length) return 'O';
    const idx = ((diffDays(iso,state.baseDate)%p.length)+p.length)%p.length;
    return p[idx];
  }
  function setSaveState(text,warn=false){ const el=$('saveState'); if(!el)return; el.textContent=text; el.classList.toggle('warn',warn); }
  function save(){
    state.updatedAt=Date.now();
    const raw=JSON.stringify(state), code=encodeState(state);
    let wrote=false;
    for(const store of [localStorage,sessionStorage]){try{store.setItem(STORAGE_KEY,raw);wrote=true}catch(e){}}
    try{window.name='shiftCalendar:'+code;wrote=true}catch(e){}
    try{history.replaceState(null,'',location.pathname+location.search+'#state='+encodeURIComponent(code));wrote=true}catch(e){}
    try{
      const req=indexedDB.open('shiftCalendarStore',1);
      req.onupgradeneeded=()=>req.result.createObjectStore('settings');
      req.onsuccess=()=>{const db=req.result; const tx=db.transaction('settings','readwrite'); tx.objectStore('settings').put(state,'current'); tx.oncomplete=()=>db.close();};
    }catch(e){}
    storageAvailable=wrote;
    setSaveState(wrote?' · 저장됨':' · 백업 코드 필요',!wrote);
    return wrote;
  }
  function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>save(),250); }
  function hydrateFromIndexedDB(){
    try{
      const req=indexedDB.open('shiftCalendarStore',1);
      req.onupgradeneeded=()=>req.result.createObjectStore('settings');
      req.onsuccess=()=>{ const db=req.result; const get=db.transaction('settings','readonly').objectStore('settings').get('current'); get.onsuccess=()=>{ const saved=get.result; if(validState(saved) && (saved.updatedAt||0)>(state.updatedAt||0)){ state=saved; render(); setSaveState(' · 저장됨',false); } db.close(); }; };
    }catch(e){}
  }
  async function copyText(text){
    try{await navigator.clipboard.writeText(text);return true}catch(e){
      const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
      const ok=document.execCommand('copy');ta.remove();return ok;
    }
  }
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1700); }
  function renderControls(){ $('yearStart').value=state.yearStart; $('baseDate').value=state.baseDate; $('pattern').value=state.pattern; renderPattern(); renderLegend(); renderQuickButtons(); }
  function renderPattern(){ const box=$('patternPreview'); box.innerHTML=''; patternKeys().forEach((k,i)=>{ const s=shifts[k]; const el=document.createElement('div'); el.className='chip'; el.innerHTML=`<span class="dot" style="background:${s.color}"></span>${i+1}. ${s.label}`; box.appendChild(el); }); }
  function renderLegend(){ const el=$('legend'); el.innerHTML=''; Object.values(shifts).forEach(s=>{ const c=document.createElement('div'); c.className='chip'; c.innerHTML=`<span class="dot" style="background:${s.color}"></span>${s.label}`; el.appendChild(c); }); }
  function renderQuickButtons(){ const el=$('quickButtons'); el.innerHTML=''; Object.entries(shifts).forEach(([k,s])=>{ const b=document.createElement('button'); b.className='btn shift'; b.textContent=s.label; b.onclick=()=>{ if(!selectedDate){toast('먼저 날짜를 선택하세요'); return;} state.overrides[selectedDate]=k; save(); render(); toast(`${selectedDate} ${s.label} 적용`); }; el.appendChild(b); }); const clear=document.createElement('button'); clear.className='btn'; clear.textContent='예외 해제'; clear.onclick=()=>{ if(selectedDate){ delete state.overrides[selectedDate]; save(); render(); }}; el.appendChild(clear); }
  function renderSummary(){ const counts={D:0,E:0,N:0,O:0,V:0,X:0}; for(let i=0;i<365;i++){ const iso=toISO(addDays(parseISO(state.yearStart),i)); counts[shiftForDate(iso)]++; } const summary=$('summary'); summary.innerHTML=''; [['D','주간'],['E','석간'],['N','야간'],['O','휴무']].forEach(([k,label])=>{ const div=document.createElement('div'); div.className='stat'; div.innerHTML=`<b>${counts[k]}</b><span>${label} / 1년</span>`; summary.appendChild(div); }); }
  function renderMonth(year, month){ const wrap=document.createElement('article'); wrap.className='month'; const first=new Date(year,month,1); const last=new Date(year,month+1,0); wrap.innerHTML=`<div class="monthHead"><strong>${year}.${pad(month+1)}</strong><span>${last.getDate()}일</span></div><div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>`; const days=document.createElement('div'); days.className='days'; for(let i=0;i<first.getDay();i++){ const b=document.createElement('button'); b.className='day blank'; b.disabled=true; days.appendChild(b); } for(let d=1;d<=last.getDate();d++){ const iso=toISO(new Date(year,month,d)); const k=shiftForDate(iso); const s=shifts[k]; const btn=document.createElement('button'); btn.className=`day ${s.cls}${iso===todayISO?' today':''}${state.overrides[iso]?' override':''}${iso===selectedDate?' selected':''}`; btn.setAttribute('aria-label',`${iso} ${s.label}`); btn.innerHTML=`<span class="num">${d}</span><span class="tag">${s.label}</span>`; btn.onclick=()=>{ selectedDate=iso; $('selectedHint').textContent=`선택: ${iso} · 현재 ${s.label}`; render(); }; days.appendChild(btn); } wrap.appendChild(days); return wrap; }
  function renderCalendar(){ const cal=$('calendar'); cal.innerHTML=''; const start=parseISO(state.yearStart); const end=addDays(start,364); $('rangeTitle').textContent=`${state.yearStart} ~ ${toISO(end)} 근무 달력`; for(let i=0;i<12;i++){ const m=new Date(start.getFullYear(), start.getMonth()+i, 1); cal.appendChild(renderMonth(m.getFullYear(),m.getMonth())); } }
  function render(){ renderControls(); renderSummary(); renderCalendar(); }
  $('apply').onclick=()=>{ state.yearStart=$('yearStart').value || defaultStart; state.baseDate=$('baseDate').value || todayISO; state.pattern=$('pattern').value || '주,주,야,야,휴,휴'; save(); selectedDate=null; $('selectedHint').textContent='업데이트 완료: 날짜를 클릭하면 예외 근무를 수정합니다.'; render(); toast('1년치 근무표가 업데이트됐어요'); };
  $('backup').onclick=async()=>{const code=encodeState(state);const ok=await copyText(code);toast(ok?'백업 코드를 복사했어요':'복사하지 못했어요');};
  $('restore').onclick=()=>{const code=prompt('보관한 백업 코드를 붙여넣으세요.');if(!code)return;try{state=decodeState(code.trim());selectedDate=null;save();render();toast('근무표를 복구했어요');}catch(e){alert('올바른 백업 코드가 아닙니다.');}};
  $('reset').onclick=()=>{ if(!confirm('저장된 설정과 예외 근무를 모두 초기화할까요?'))return; state=defaults(); selectedDate=null; save(); render(); toast('초기값으로 되돌렸어요'); };
  ['yearStart','baseDate','pattern'].forEach(id=>{
    $(id).addEventListener('input',()=>{
      if(id==='yearStart') state.yearStart=$(id).value || state.yearStart;
      if(id==='baseDate') state.baseDate=$(id).value || state.baseDate;
      if(id==='pattern'){state.pattern=$(id).value; renderPattern();}
      scheduleSave();
    });
    $(id).addEventListener('change',()=>{ render(); save(); });
  });
  render();
  if(state.updatedAt) setSaveState(' · 저장된 설정 불러옴',false);
  hydrateFromIndexedDB();
})();
</script>
</body>
</html>
